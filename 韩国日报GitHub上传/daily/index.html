<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>历史日报</title>
  <link rel="stylesheet" href="../assets/unlock.css">
</head>
<body data-payload="../secure/history.enc.json">
  <main id="unlock-panel" class="unlock-layout">
    <section class="unlock-card" aria-labelledby="unlock-title">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
      <p class="product-name">韩国事业部日报</p>
      <h1 id="unlock-title">输入访问密码</h1>
      <p class="unlock-copy">报告内容已加密，密码只在当前浏览器会话中使用。</p>
      <form id="unlock-form" novalidate>
        <label for="site-password">访问密码</label>
        <div class="password-row">
          <input id="site-password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">打开日报</button>
        </div>
        <p id="unlock-error" class="unlock-error" role="alert" aria-live="polite"></p>
      </form>
      <p class="privacy-note">离开当前会话后需要重新输入。</p>
    </section>
  </main>
  <main id="content" hidden></main>
  <script type="module" src="../assets/unlock.mjs"></script>
</body>
</html>
